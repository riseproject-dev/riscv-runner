# SPDX-License-Identifier: MIT
name: Build and Deploy Control Plane

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-control-plane.yml'
      - 'control-plane/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-control-plane.yml'
      - 'control-plane/**'
  workflow_dispatch:

env:
  REGISTRY: rg.fr-par.scw.cloud/funcscwriseriscvrunnerappqdvknz9s
  IMAGE: riscv-runner
  PROD_URL: https://riseriscvrunnerappqdvknz9s-ghfe.functions.fnc.fr-par.scw.cloud
  STAGING_URL: https://riseriscvrunnerappst73ndwr0w-ghfe.functions.fnc.fr-par.scw.cloud

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          sparse-checkout: control-plane
      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: control-plane/go.mod
          cache-dependency-path: control-plane/go.sum
      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt diff:"
            echo "$out"
            exit 1
          fi
      - name: go test
        run: go test -race ./... -coverprofile=coverage.out

  build:
    needs: [test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: control-plane
    env:
      # Dependabot runs read the (empty) Dependabot secret store, so SCW_SECRET_KEY
      # is unavailable and a registry login would fail. Build without publishing.
      PUSH_IMAGES: ${{ github.repository_owner == 'riseproject-dev' && github.actor != 'dependabot[bot]' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: control-plane

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Container Registry
        if: env.PUSH_IMAGES == 'true'
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0

      - name: Build ghfe image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64
          context: control-plane
          file: control-plane/Dockerfile
          target: ghfe
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:ghfe-sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=docker
          cache-to: |
            ${{ github.ref_name == github.event.repository.default_branch && 'type=gha,scope=docker' || '' }}
          push: ${{ env.PUSH_IMAGES == 'true' }}

      - name: Build scheduler image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/amd64
          context: control-plane
          file: control-plane/Dockerfile
          target: scheduler
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:scheduler-sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=docker
          cache-to: |
            ${{ github.ref_name == github.event.repository.default_branch && 'type=gha,scope=docker' || '' }}
          push: ${{ env.PUSH_IMAGES == 'true' }}

  deploy-staging:
    if: github.repository_owner == 'riseproject-dev' && github.ref_name == github.event.repository.default_branch
    name: "deploy to staging"
    needs: [build]
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: ${{ github.workflow_ref }}-deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            control-plane
            bin/check-health.py

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Tag ghfe image for staging
        run: >-
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:ghfe-staging \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:ghfe-sha-${{ github.sha }}

      - name: Tag scheduler image for staging
        run: >-
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:scheduler-staging \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:scheduler-sha-${{ github.sha }}

      - name: Deploy to Scaleway
        working-directory: control-plane
        run: npm ci && npx serverless deploy --stage=staging
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          GHAPP_WEBHOOK_SECRET: ${{ secrets.GHAPP_WEBHOOK_SECRET }}
          GHAPP_ORG_PRIVATE_KEY: ${{ secrets.GHAPP_ORG_PRIVATE_KEY }}
          GHAPP_PERSONAL_PRIVATE_KEY: ${{ secrets.GHAPP_PERSONAL_PRIVATE_KEY }}
          K8S_KUBECONFIG: ${{ secrets.K8S_KUBECONFIG_GH_APP }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          TRACE_API_SECRET: ${{ secrets.TRACE_API_SECRET }}

      - name: Health check
        working-directory: control-plane
        run: python3 ./bin/check-health.py

      # FIXME: with scaleway incident from 2026-05-22, we have no more runners on staging environment
      # - name: Trigger sample workflow
      #   env:
      #     GH_TOKEN: ${{ secrets.RISCV_RUNNER_SAMPLE_STAGING_ACCESS_TOKEN }}
      #     GH_REPO: riseproject-staging/riscv-runner-sample
      #     GH_WORKFLOW: hello.yml
      #   run: |
      #     gh workflow run ${GH_WORKFLOW} --repo ${GH_REPO}
      #     sleep 5
      #     gh run watch $(gh run list --repo ${GH_REPO} --workflow ${GH_WORKFLOW} --limit 1 --json databaseId --jq '.[0].databaseId') --repo ${GH_REPO} --interval 15 --exit-status

  deploy-prod:
    if: github.repository_owner == 'riseproject-dev' && github.ref_name == github.event.repository.default_branch
    name: "deploy to prod"
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: ${{ github.workflow_ref }}-deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: control-plane

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Container Registry
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Tag ghfe image for prod
        run: >-
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:ghfe-prod \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:ghfe-sha-${{ github.sha }}

      - name: Tag scheduler image for prod
        run: >-
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:scheduler-prod \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:scheduler-sha-${{ github.sha }}

      - name: Deploy to Scaleway
        working-directory: control-plane
        run: npm ci && npx serverless@3 deploy --stage=main
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          GHAPP_WEBHOOK_SECRET: ${{ secrets.GHAPP_WEBHOOK_SECRET }}
          GHAPP_ORG_PRIVATE_KEY: ${{ secrets.GHAPP_ORG_PRIVATE_KEY }}
          GHAPP_PERSONAL_PRIVATE_KEY: ${{ secrets.GHAPP_PERSONAL_PRIVATE_KEY }}
          K8S_KUBECONFIG: ${{ secrets.K8S_KUBECONFIG_GH_APP }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          TRACE_API_SECRET: ${{ secrets.TRACE_API_SECRET }}

      - name: Health check
        working-directory: control-plane
        run: python3 ./bin/check-health.py

      - name: Trigger sample workflow
        env:
          GH_TOKEN: ${{ secrets.RISCV_RUNNER_SAMPLE_ACCESS_TOKEN }}
          GH_REPO: riseproject-dev/riscv-runner-sample
          GH_WORKFLOW: hello.yml
        run: |
          gh workflow run ${GH_WORKFLOW} --repo ${GH_REPO}
          sleep 5
          gh run watch $(gh run list --repo ${GH_REPO} --workflow ${GH_WORKFLOW} --limit 1 --json databaseId --jq '.[0].databaseId') --repo ${GH_REPO} --interval 15 --exit-status
