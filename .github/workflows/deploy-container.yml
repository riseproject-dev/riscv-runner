# SPDX-License-Identifier: MIT
name: Build and Deploy Container

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-container.yml'
      - 'container/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-container.yml'
      - 'container/**'
  workflow_dispatch:

env:
  REGISTRY: rg.fr-par.scw.cloud/funcscwriseriscvrunnerappqdvknz9s
  IMAGE: riscv-runner
  PROD_URL: https://riseriscvrunnerappqdvknz9s-ghfe.functions.fnc.fr-par.scw.cloud
  STAGING_URL: https://riseriscvrunnerappst73ndwr0w-ghfe.functions.fnc.fr-par.scw.cloud

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: container
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          sparse-checkout: container
      - name: Setup Go
        uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: container/go.mod
          cache-dependency-path: container/go.sum
      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt diff:"
            echo "$out"
            exit 1
          fi
      - name: go test
        run: go test -race ./... -coverprofile=coverage.out

  build:
    needs: [test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: container
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: container

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Container Registry
        if: github.repository_owner == 'riseproject-dev'
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@80c7e94dd9b9319bd5eb7a0e0fe9291e23a2a2e9 # v6.1.0

      - name: Build ghfe image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          platforms: linux/amd64
          context: container
          file: container/Dockerfile
          target: ghfe
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:ghfe-sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=docker
          cache-to: |
            ${{ github.ref_name == github.event.repository.default_branch && 'type=gha,scope=docker' || '' }}
          push: ${{ github.repository_owner == 'riseproject-dev' }}

      - name: Build scheduler image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          platforms: linux/amd64
          context: container
          file: container/Dockerfile
          target: scheduler
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:scheduler-sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=docker
          cache-to: |
            ${{ github.ref_name == github.event.repository.default_branch && 'type=gha,scope=docker' || '' }}
          push: ${{ github.repository_owner == 'riseproject-dev' }}

  deploy-staging:
    if: github.repository_owner == 'riseproject-dev' && github.ref_name == github.event.repository.default_branch
    name: "deploy to staging"
    needs: [build]
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: ${{ github.workflow_ref }}-deploy-staging
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: |
            container
            bin/check-health.py

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Tag ghfe image for staging
        run: >-
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:ghfe-staging \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:ghfe-sha-${{ github.sha }}

      - name: Tag scheduler image for staging
        run: >-
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:scheduler-staging \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:scheduler-sha-${{ github.sha }}

      - name: Deploy to Scaleway
        working-directory: container
        run: npm ci && npx serverless deploy --stage=staging
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          GHAPP_WEBHOOK_SECRET: ${{ secrets.GHAPP_WEBHOOK_SECRET }}
          GHAPP_ORG_PRIVATE_KEY: ${{ secrets.GHAPP_ORG_PRIVATE_KEY }}
          GHAPP_PERSONAL_PRIVATE_KEY: ${{ secrets.GHAPP_PERSONAL_PRIVATE_KEY }}
          K8S_KUBECONFIG: ${{ secrets.K8S_KUBECONFIG_GH_APP }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          TRACE_API_SECRET: ${{ secrets.TRACE_API_SECRET }}

      - name: Health check
        working-directory: container
        run: python3 ./bin/check-health.py

      # FIXME: with scaleway incident from 2026-05-22, we have no more runners on staging environment
      # - name: Trigger sample workflow
      #   env:
      #     GH_TOKEN: ${{ secrets.RISCV_RUNNER_SAMPLE_STAGING_ACCESS_TOKEN }}
      #     GH_REPO: riseproject-staging/riscv-runner-sample
      #     GH_WORKFLOW: hello.yml
      #   run: |
      #     gh workflow run ${GH_WORKFLOW} --repo ${GH_REPO}
      #     sleep 5
      #     gh run watch $(gh run list --repo ${GH_REPO} --workflow ${GH_WORKFLOW} --limit 1 --json databaseId --jq '.[0].databaseId') --repo ${GH_REPO} --interval 15 --exit-status

  deploy-prod:
    if: github.repository_owner == 'riseproject-dev' && github.ref_name == github.event.repository.default_branch
    name: "deploy to prod"
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: ${{ github.workflow_ref }}-deploy-prod
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: container

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Login to Container Registry
        uses: docker/login-action@650006c6eb7dba73a995cc03b0b2d7f5ca915bee # v4.2.0
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Tag ghfe image for prod
        run: >-
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:ghfe-prod \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:ghfe-sha-${{ github.sha }}

      - name: Tag scheduler image for prod
        run: >-
          docker buildx imagetools create \
            -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:scheduler-prod \
            ${{ env.REGISTRY }}/${{ env.IMAGE }}:scheduler-sha-${{ github.sha }}

      - name: Deploy to Scaleway
        working-directory: container
        run: npm ci && npx serverless@3 deploy --stage=main
        env:
          SCW_SECRET_KEY: ${{ secrets.SCW_SECRET_KEY }}
          GHAPP_WEBHOOK_SECRET: ${{ secrets.GHAPP_WEBHOOK_SECRET }}
          GHAPP_ORG_PRIVATE_KEY: ${{ secrets.GHAPP_ORG_PRIVATE_KEY }}
          GHAPP_PERSONAL_PRIVATE_KEY: ${{ secrets.GHAPP_PERSONAL_PRIVATE_KEY }}
          K8S_KUBECONFIG: ${{ secrets.K8S_KUBECONFIG_GH_APP }}
          POSTGRES_URL: ${{ secrets.POSTGRES_URL }}
          TRACE_API_SECRET: ${{ secrets.TRACE_API_SECRET }}

      - name: Health check
        working-directory: container
        run: python3 ./bin/check-health.py

      - name: Trigger sample workflow
        env:
          GH_TOKEN: ${{ secrets.RISCV_RUNNER_SAMPLE_ACCESS_TOKEN }}
          GH_REPO: riseproject-dev/riscv-runner-sample
          GH_WORKFLOW: hello.yml
        run: |
          gh workflow run ${GH_WORKFLOW} --repo ${GH_REPO}
          sleep 5
          gh run watch $(gh run list --repo ${GH_REPO} --workflow ${GH_WORKFLOW} --limit 1 --json databaseId --jq '.[0].databaseId') --repo ${GH_REPO} --interval 15 --exit-status
