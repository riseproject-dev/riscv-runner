# SPDX-License-Identifier: MIT
name: Build and Deploy Device Plugin

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-device-plugin.yml'
      - 'device-plugin/**'
  pull_request:
    branches:
      - main
    paths:
      - '.github/workflows/deploy-device-plugin.yml'
      - 'device-plugin/**'
  workflow_dispatch:

env:
  REGISTRY: rg.fr-par.scw.cloud/funcscwriseriscvrunnerappqdvknz9s
  IMAGE: riscv-runner

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device-plugin
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: device-plugin

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: device-plugin/go.mod
          cache-dependency-path: device-plugin/go.sum

      - name: go vet
        run: go vet ./...
      - name: gofmt check
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "::error::gofmt diff:"
            echo "$out"
            exit 1
          fi
      - name: go test
        run: go test -race ./...

  build:
    needs: [test]
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: device-plugin
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: device-plugin

      - name: Setup QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Container Registry
        if: github.repository_owner == 'riseproject-dev'
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Extract metadata for Docker
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0

      - name: Build device-plugin image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/riscv64
          context: device-plugin
          file: device-plugin/Dockerfile
          target: device-plugin
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:device-plugin-sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=docker
          cache-to: |
            ${{ github.ref_name == github.event.repository.default_branch && 'type=gha,scope=docker' || '' }}
          push: ${{ github.repository_owner == 'riseproject-dev' }}

      - name: Build node-labeller image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          platforms: linux/riscv64
          context: device-plugin
          file: device-plugin/Dockerfile
          target: node-labeller
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE }}:node-labeller-sha-${{ github.sha }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: |
            type=gha,scope=docker
          cache-to: |
            ${{ github.ref_name == github.event.repository.default_branch && 'type=gha,scope=docker' || '' }}
          push: ${{ github.repository_owner == 'riseproject-dev' }}

  deploy-staging:
    if: github.repository_owner == 'riseproject-dev' && github.ref_name == github.event.repository.default_branch
    name: "deploy to staging"
    needs: [build]
    runs-on: ubuntu-latest
    environment: staging
    concurrency:
      group: ${{ github.workflow_ref }}-deploy-staging
      cancel-in-progress: false
    env:
      TAG: staging
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: device-plugin

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Tag device-plugin image for staging
        run: >-
          docker buildx imagetools create
          -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:device-plugin-${{ env.TAG }}
          ${{ env.REGISTRY }}/${{ env.IMAGE }}:device-plugin-sha-${{ github.sha }}

      - name: Tag node-labeller image for staging
        run: >-
          docker buildx imagetools create
          -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:node-labeller-${{ env.TAG }}
          ${{ env.REGISTRY }}/${{ env.IMAGE }}:node-labeller-sha-${{ github.sha }}

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.K8S_KUBECONFIG_GH_DEPLOY }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply node-labeller DaemonSet
        run: |
          envsubst < device-plugin/k8s-ds-node-labeller.yaml | kubectl apply -f -
          kubectl rollout restart daemonset/rise-riscv-runner-node-labeller -n kube-system

      - name: Apply device-plugin DaemonSet and wait for rollout
        run: |
          envsubst < device-plugin/k8s-ds-device-plugin.yaml | kubectl apply -f -
          kubectl rollout restart daemonset/rise-riscv-runner-device-plugin -n kube-system
          while ! kubectl rollout status daemonset/rise-riscv-runner-device-plugin -n kube-system --timeout=5m 2>/dev/null; do
            kubectl get pods -o wide -n kube-system \
              -l app.kubernetes.io/name=riscv-runner-device-plugin \
              -l app.kubernetes.io/component=device-plugin \
              --sort-by=.spec.nodeName 2>/dev/null
          done

  deploy-prod:
    if: github.repository_owner == 'riseproject-dev' && github.ref_name == github.event.repository.default_branch
    name: "deploy to prod"
    needs: [build, deploy-staging]
    runs-on: ubuntu-latest
    environment: prod
    concurrency:
      group: ${{ github.workflow_ref }}-deploy-prod
      cancel-in-progress: false
    env:
      TAG: latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          sparse-checkout: device-plugin

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Login to Container Registry
        uses: docker/login-action@abd2ef45e78c5afb21d64d4ca52ee8550d9572c7 # v4.5.1
        with:
          registry: ${{ env.REGISTRY }}
          username: nologin
          password: ${{ secrets.SCW_SECRET_KEY }}

      - name: Tag device-plugin image for prod
        run: >-
          docker buildx imagetools create
          -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:device-plugin-${{ env.TAG }}
          ${{ env.REGISTRY }}/${{ env.IMAGE }}:device-plugin-sha-${{ github.sha }}

      - name: Tag node-labeller image for prod
        run: >-
          docker buildx imagetools create
          -t ${{ env.REGISTRY }}/${{ env.IMAGE }}:node-labeller-${{ env.TAG }}
          ${{ env.REGISTRY }}/${{ env.IMAGE }}:node-labeller-sha-${{ github.sha }}

      - name: Set up kubeconfig
        run: |
          mkdir -p ~/.kube
          echo "${{ secrets.K8S_KUBECONFIG_GH_DEPLOY }}" > ~/.kube/config
          chmod 600 ~/.kube/config

      - name: Apply node-labeller DaemonSet
        run: |
          envsubst < device-plugin/k8s-ds-node-labeller.yaml | kubectl apply -f -
          kubectl rollout restart daemonset/rise-riscv-runner-node-labeller -n kube-system

      - name: Apply device-plugin DaemonSet and wait for rollout
        run: |
          envsubst < device-plugin/k8s-ds-device-plugin.yaml | kubectl apply -f -
          kubectl rollout restart daemonset/rise-riscv-runner-device-plugin -n kube-system
          while ! kubectl rollout status daemonset/rise-riscv-runner-device-plugin -n kube-system --timeout=5m 2>/dev/null; do
            kubectl get pods -o wide -n kube-system \
              -l app.kubernetes.io/name=riscv-runner-device-plugin \
              -l app.kubernetes.io/component=device-plugin \
              --sort-by=.spec.nodeName 2>/dev/null
          done
