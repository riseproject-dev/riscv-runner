# SPDX-License-Identifier: MIT
apiVersion: v1
kind: ServiceAccount
metadata:
  name: rise-riscv-runner-device-plugin
  namespace: kube-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: rise-riscv-runner-device-plugin
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: rise-riscv-runner-device-plugin
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: rise-riscv-runner-device-plugin
subjects:
  - kind: ServiceAccount
    name: rise-riscv-runner-device-plugin
    namespace: kube-system
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: rise-riscv-runner-device-plugin
  namespace: kube-system
  labels:
    app.kubernetes.io/name: riscv-runner-device-plugin
    app.kubernetes.io/component: device-plugin
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: riscv-runner-device-plugin
      app.kubernetes.io/component: device-plugin
  updateStrategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: "20%"
  template:
    metadata:
      labels:
        app.kubernetes.io/name: riscv-runner-device-plugin
        app.kubernetes.io/component: device-plugin
    spec:
      serviceAccountName: rise-riscv-runner-device-plugin
      nodeSelector:
        kubernetes.io/arch: riscv64
      priorityClassName: system-node-critical
      initContainers:
        - name: ubuntu-2404-image-cache
          image: rg.fr-par.scw.cloud/funcscwriseriscvrunnerappqdvknz9s/riscv-runner:ubuntu-24.04-${TAG}
          imagePullPolicy: Always
          command: ["true"]
        # TODO: Enable 26.04 on machines; running out of disk space for now
        # - name: ubuntu-2604-image-cache
        #   image: rg.fr-par.scw.cloud/funcscwriseriscvrunnerappqdvknz9s/riscv-runner:ubuntu-26.04-${TAG}
        #   imagePullPolicy: Always
        #   command: ["true"]
      containers:
        - name: device-plugin
          image: rg.fr-par.scw.cloud/funcscwriseriscvrunnerappqdvknz9s/riscv-runner:device-plugin-${TAG}
          imagePullPolicy: Always
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
          volumeMounts:
            - name: device-plugins
              mountPath: /var/lib/kubelet/device-plugins
            - name: sysfs
              mountPath: /sys
              readOnly: true
          securityContext:
            privileged: true
      volumes:
        - name: device-plugins
          hostPath:
            path: /var/lib/kubelet/device-plugins
        - name: sysfs
          hostPath:
            path: /sys
